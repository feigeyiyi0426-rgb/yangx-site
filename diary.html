<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="YANGX 个人日记记录，加密保存。" />
    <title>YANGX | 个人日记记录</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header" aria-label="YANGX 导航">
      <a class="brand" href="./index.html">YANGX</a>
      <nav class="nav-links" aria-label="主要导航">
        <a href="./forum.html">论坛</a>
        <a href="./diary.html" aria-current="page">日记</a>
        <a href="./chat.html">私聊</a>
        <a href="./news.html">新闻</a>
        <a href="./ideas.html">想法</a>
        <a href="./projects.html">项目</a>
      </nav>
    </header>

    <main class="page-shell">
      <section class="content-section section-shell page-section" aria-labelledby="diary-title">
        <div class="page-top">
          <a class="page-back" href="./index.html">返回首页</a>
          <p class="eyebrow">PERSONAL DIARY</p>
          <h1 id="diary-title">个人日记记录</h1>
          <p>这是你的个人使用区域。输入后台密码后才能读取、保存和删除日记；正文会先在浏览器里加密。</p>
        </div>

        <div class="forum-layout">
          <form class="forum-form" id="diary-entry-form">
            <div class="form-row">
              <label for="diary-password">个人日记密码</label>
              <input id="diary-password" name="password" minlength="4" maxlength="80" required type="password" placeholder="输入后台密码" />
            </div>
            <button class="button primary forum-submit" id="diary-enter-button" type="submit">进入日记</button>
            <p class="form-note" id="diary-entry-status">仅用于你的个人日记。密码不会保存在网页里。</p>
          </form>

          <section class="forum-board is-hidden" id="diary-panel" aria-live="polite">
            <div class="forum-toolbar">
              <div>
                <p class="card-meta">我的日记</p>
                <h3 id="diary-current-title">个人日记记录</h3>
              </div>
              <div class="admin-actions">
                <button class="button secondary small-button" id="refresh-diary" type="button">刷新</button>
                <button class="button secondary small-button" id="leave-diary" type="button">退出</button>
              </div>
            </div>

            <form id="diary-compose-form">
              <div class="form-row">
                <label for="diary-note-title">标题</label>
                <input id="diary-note-title" name="title" maxlength="80" required placeholder="今天记录什么？" />
              </div>
              <div class="form-row">
                <label for="diary-note-body">内容</label>
                <textarea id="diary-note-body" name="body" rows="8" maxlength="6000" required placeholder="写给自己看的内容..."></textarea>
              </div>
              <button class="button primary forum-submit" id="save-diary" type="submit">保存日记</button>
              <p class="form-note" id="diary-status">数据库只保存加密正文。忘记密码后无法恢复旧内容。</p>
            </form>

            <div class="forum-posts" id="diary-list"></div>
          </section>
        </div>
      </section>
    </main>

    <footer class="site-footer section-shell">
      <p>YANGX</p>
      <p>个人日记记录</p>
    </footer>

    <script type="module" src="./diary-page.js"></script>
  </body>
</html>
