<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="YANGX 个人日记记录，加密保存。" />
    <title>YANGX | 个人日记记录</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .diary-layout {
        grid-template-columns: minmax(250px, 0.46fr) minmax(0, 1.54fr);
      }

      .diary-panel {
        display: grid;
        gap: 14px;
      }

      .diary-workbench {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(260px, 0.78fr);
        gap: 12px;
      }

      .diary-section {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(8, 11, 16, 0.28);
      }

      .diary-section-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: baseline;
        margin-bottom: 12px;
      }

      .diary-section-head h3 {
        margin: 0;
        font-size: 1rem;
      }

      .diary-section-head p {
        margin: 0;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .diary-history .forum-posts,
      .diary-files,
      .diary-entry-attachments {
        display: grid;
        gap: 10px;
      }

      .diary-entry-attachments {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }

      .diary-entry-attachments h5 {
        margin: 0;
        color: var(--green);
        font-size: 0.86rem;
      }

      .diary-file-card {
        overflow: hidden;
      }

      .diary-file-card.is-attached {
        background: rgba(255, 255, 255, 0.035);
        box-shadow: none;
      }

      .diary-image-preview {
        display: block;
        width: min(220px, 100%);
        margin: 10px 0 12px;
        color: var(--muted);
      }

      .diary-image-thumb {
        display: block;
        width: 100%;
        min-height: 66px;
        padding: 0;
        overflow: hidden;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.035);
        cursor: zoom-in;
      }

      .diary-image-thumb img {
        display: block;
        width: 100%;
        height: 132px;
        object-fit: cover;
      }

      .diary-image-thumb span {
        display: block;
        padding: 8px 10px;
        color: var(--muted);
        font-size: 0.78rem;
        text-align: left;
      }

      .diary-lightbox {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(0, 0, 0, 0.82);
        backdrop-filter: blur(8px);
      }

      .diary-lightbox.is-hidden {
        display: none;
      }

      .diary-lightbox img {
        max-width: min(1100px, 94vw);
        max-height: 84vh;
        object-fit: contain;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #05070a;
      }

      .diary-lightbox button {
        position: absolute;
        top: 18px;
        right: 18px;
      }

      @media (max-width: 980px) {
        .diary-layout,
        .diary-workbench {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header" aria-label="YANGX 导航">
      <a class="brand" href="./index.html">YANGX</a>
      <nav class="nav-links" aria-label="主要导航">
        <a href="./forum.html">论坛</a>
        <a href="./diary.html" aria-current="page">日记</a>
        <a href="./chat.html">私聊</a>
        <a href="./news.html">新闻</a>
        <a href="./ideas.html">想法</a>
        <a href="./projects.html">项目</a>
      </nav>
    </header>

    <main class="page-shell">
      <section class="content-section section-shell page-section" aria-labelledby="diary-title">
        <div class="page-top">
          <a class="page-back" href="./index.html">返回首页</a>
          <p class="eyebrow">PERSONAL DIARY</p>
          <h1 id="diary-title">个人日记记录</h1>
          <p>这是你的个人使用区域。输入后台密码后才能读取、保存和删除日记；正文和附件都会先在浏览器里加密。</p>
        </div>

        <div class="forum-layout diary-layout">
          <form class="forum-form" id="diary-entry-form">
            <div class="form-row">
              <label for="diary-password">个人日记密码</label>
              <input id="diary-password" name="password" minlength="4" maxlength="80" required type="password" placeholder="输入后台密码" />
            </div>
            <button class="button primary forum-submit" id="diary-enter-button" type="submit">进入日记</button>
            <p class="form-note" id="diary-entry-status">仅用于你的个人日记。密码不会保存在网页里。</p>
          </form>

          <section class="forum-board diary-panel is-hidden" id="diary-panel" aria-live="polite">
            <div class="forum-toolbar">
              <div>
                <p class="card-meta">我的日记</p>
                <h3 id="diary-current-title">个人日记记录</h3>
              </div>
              <div class="admin-actions">
                <button class="button secondary small-button" id="refresh-diary" type="button">刷新</button>
                <button class="button secondary small-button" id="leave-diary" type="button">退出</button>
              </div>
            </div>

            <div class="diary-workbench">
              <section class="diary-section">
                <div class="diary-section-head">
                  <h3>写一条记录</h3>
                  <p>可直接配图</p>
                </div>
                <form id="diary-compose-form">
                  <div class="form-row">
                    <label for="diary-note-title">标题</label>
                    <input id="diary-note-title" name="title" maxlength="80" required placeholder="今天记录什么？" />
                  </div>
                  <div class="form-row">
                    <label for="diary-note-body">内容</label>
                    <textarea id="diary-note-body" name="body" rows="8" maxlength="6000" required placeholder="写给自己看的内容..."></textarea>
                  </div>
                  <div class="form-row">
                    <label for="diary-note-file">配图 / 附件（可选）</label>
                    <input
                      id="diary-note-file"
                      name="note-file"
                      type="file"
                      accept=".jpg,.jpeg,.png,.webp,.gif,.pdf,.txt,.doc,.docx,.xls,.xlsx,.zip,image/jpeg,image/png,image/webp,image/gif,application/pdf,text/plain,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/zip,application/x-zip-compressed"
                    />
                  </div>
                  <button class="button primary forum-submit" id="save-diary" type="submit">保存日记</button>
                  <p class="form-note" id="diary-status">如果选择图片，保存后会显示在这条日记下面。</p>
                </form>
              </section>

              <section class="diary-section">
                <div class="diary-section-head">
                  <h3>单独附件</h3>
                  <p>不关联具体日记</p>
                </div>
                <form id="diary-file-form">
                  <div class="form-row">
                    <label for="diary-file">选择文件</label>
                    <input
                      id="diary-file"
                      name="file"
                      type="file"
                      accept=".jpg,.jpeg,.png,.webp,.gif,.pdf,.txt,.doc,.docx,.xls,.xlsx,.zip,image/jpeg,image/png,image/webp,image/gif,application/pdf,text/plain,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/zip,application/x-zip-compressed"
                    />
                  </div>
                  <button class="button primary forum-submit" id="upload-diary-file" type="submit">上传附件</button>
                  <p class="form-note" id="diary-file-status">支持图片和普通文件，单个不超过 10MB，不支持视频。</p>
                </form>
                <div class="diary-files" id="diary-files"></div>
              </section>
            </div>

            <section class="diary-section diary-history">
              <div class="diary-section-head">
                <h3>历史记录</h3>
                <p>点击加载小图，再点小图看原图</p>
              </div>
              <div class="forum-posts" id="diary-list"></div>
            </section>
          </section>
        </div>
      </section>
    </main>

    <footer class="site-footer section-shell">
      <p>YANGX</p>
      <p>个人日记记录</p>
    </footer>

    <script type="module" src="./diary-page.js"></script>
  </body>
</html>
