<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="YANGX 农业新闻更新，农业和农业科技为主，少量保留币圈快讯。" />
    <title>YANGX | 农业新闻</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header" aria-label="YANGX 导航">
      <a class="brand" href="./index.html">YANGX</a>
      <nav class="nav-links" aria-label="主要导航">
        <a href="./forum.html">论坛</a>
        <a href="./chat.html">私聊</a>
        <a href="./news.html" aria-current="page">新闻</a>
        <a href="./projects.html">项目</a>
      </nav>
    </header>

    <main class="page-shell">
      <section id="news" class="content-section section-shell page-section" aria-labelledby="news-title">
        <div class="page-top">
          <a class="page-back" href="./index.html">返回首页</a>
          <p class="eyebrow">AGRICULTURE NEWS</p>
          <h1 id="news-title">农业新闻</h1>
          <p>农业、农业科技和粮食市场为主，少量保留币圈快讯。自动中文摘要，保留原始来源链接。</p>
        </div>

        <nav class="section-switcher" aria-label="板块切换">
          <a class="home-card" href="./forum.html">
            <span aria-hidden="true"></span>
            <strong>论坛</strong>
            <small>公开留言 / 私密留言 / 回复</small>
          </a>
          <a class="home-card" href="./chat.html">
            <span aria-hidden="true"></span>
            <strong>私聊</strong>
            <small>房间密码 / 加密消息</small>
          </a>
          <a class="home-card is-active" href="./news.html">
            <span aria-hidden="true"></span>
            <strong>新闻</strong>
            <small>农业 / 农业科技 / 币圈少量</small>
          </a>
          <a class="home-card" href="./projects.html">
            <span aria-hidden="true"></span>
            <strong>项目</strong>
            <small>全球科技项目资讯</small>
          </a>
        </nav>

        <div class="news-panel">
          <div class="news-toolbar">
            <div>
              <p class="card-meta">最新线索</p>
              <p class="news-note">农业新闻占多数，币圈新闻只保留少量。新闻有缓存，通常 5 分钟内更新一次。</p>
              <div class="news-sources" id="news-sources"></div>
            </div>
            <button class="button secondary small-button" id="refresh-news" type="button">刷新新闻</button>
          </div>
          <div class="news-status" id="news-status">正在读取农业新闻...</div>
          <div class="news-list" id="news-list"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer section-shell">
      <p>YANGX</p>
      <p>农业新闻</p>
    </footer>

    <script type="module" src="./news-page.js"></script>
  </body>
</html>
