<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>YANGX | 后台</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./content-admin.css" />
  </head>
  <body class="admin-page">
    <main class="admin-shell">
      <section class="admin-header">
        <div>
          <p class="eyebrow">YANGX ADMIN</p>
          <h1>网站后台</h1>
          <p>管理想法列表和项目列表。</p>
        </div>
        <a class="button secondary small-button" href="./">返回网站</a>
      </section>

      <section class="admin-login" id="admin-login">
        <label for="admin-password">后台密码</label>
        <div class="admin-login-row">
          <input id="admin-password" type="password" placeholder="输入后台密码" />
          <button class="button primary small-button" id="admin-login-button" type="button">进入后台</button>
        </div>
        <p class="form-note" id="admin-status">请输入后台密码后管理内容。</p>
      </section>

      <section class="admin-tools is-hidden" id="content-tools">
        <div class="admin-tools-row">
          <div>
            <p class="card-meta">想法 / 项目</p>
            <p class="admin-count" id="content-count">正在读取...</p>
          </div>
          <button class="button secondary small-button" id="content-refresh" type="button">刷新内容</button>
        </div>

        <form class="admin-content-form" id="content-form">
          <input type="hidden" id="content-id" name="id" />
          <div class="form-row">
            <label for="content-kind">栏目</label>
            <select id="content-kind" name="kind" required>
              <option value="idea">想法</option>
              <option value="project">项目</option>
            </select>
          </div>
          <div class="form-row">
            <label for="content-title">标题</label>
            <input id="content-title" name="title" maxlength="80" required placeholder="例如：长期观察" />
          </div>
          <div class="form-row admin-wide">
            <label for="content-summary">简介</label>
            <textarea id="content-summary" name="summary" maxlength="360" required placeholder="写一句简洁说明"></textarea>
          </div>
          <div class="form-row">
            <label for="content-tag">标签</label>
            <input id="content-tag" name="tag" maxlength="40" placeholder="例如：记录 / 工具 / 网站" />
          </div>
          <div class="form-row">
            <label for="content-url">链接</label>
            <input id="content-url" name="url" maxlength="300" placeholder="可选，例如 https://..." />
          </div>
          <div class="form-row">
            <label for="content-order">排序</label>
            <input id="content-order" name="sort_order" type="number" value="100" />
          </div>
          <label class="admin-check">
            <input id="content-published" name="is_published" type="checkbox" checked />
            <span>公开显示</span>
          </label>
          <div class="admin-actions admin-wide">
            <button class="button primary small-button" id="content-save" type="submit">保存内容</button>
            <button class="button secondary small-button" id="content-reset" type="button">清空表单</button>
          </div>
        </form>

        <div class="admin-posts" id="content-list"></div>
      </section>
    </main>

    <script type="module" src="./admin-page.js"></script>
  </body>
</html>
